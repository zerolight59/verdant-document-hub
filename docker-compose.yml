services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-verdant_app}
      MYSQL_USER: ${MYSQL_USER:-verdant}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-verdant}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-verdant-root}
    ports:
      - "3307:3306"
    volumes:
      - verdant_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-verdant-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-verdant}:${MYSQL_PASSWORD:-verdant}@mysql:3306/${MYSQL_DATABASE:-verdant_app}?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-at-least-32-chars}
      FRONTEND_ORIGIN: http://localhost:3000
      STORAGE_ROOT: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - verdant_files:/app/storage
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  verdant_mysql:
  verdant_files:


